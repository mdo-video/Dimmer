name: Build APK
on:
  push:
  workflow_dispatch:

# Serve per creare la release con l'APK (gli aggiornamenti OTA leggono da lì).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q -o "$ZIP" -d _src
          echo "PROJ=$(dirname "$(find _src -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compila
        run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.PROJ }}
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Prepara l'APK
        run: cp "${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk" Dimmer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dimmer
          path: Dimmer.apk
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Dimmer.apk \
            --target "${{ github.sha }}" \
            --title "Dimmer v${{ github.run_number }}" \
            --notes "Build automatica ${{ github.run_number }}" \
            --latest
